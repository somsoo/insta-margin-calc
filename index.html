<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인스타 공동구매 마진 계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); min-height: 100vh; font-family: 'Pretendard', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); border: 1px solid rgba(255, 255, 255, 0.18); }
        .receipt { background: #fff; padding: 20px; border-radius: 10px; border: 1px dashed #ccc; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">
    <div class="glass-card w-full max-w-md p-8 mb-6">
        <h1 class="text-3xl font-extrabold text-center text-gray-800 mb-2">인스타 공동구매 마진 계산기</h1>
        <p class="text-center text-gray-600 mb-8">플랫폼 수수료와 배송비를 제외한 인스타 공구 순수익 마진을 계산합니다.</p>
        
        <!-- LOGIC START -->
        <div class="max-w-lg mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100 p-6 sm:p-8 font-sans">
  <!-- Header -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 text-white shadow-lg mb-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
      </svg>
    </div>
    <h1 class="text-2xl font-bold bg-gradient-to-r from-slate-900 via-rose-950 to-slate-800 bg-clip-text text-transparent">
      인스타 공구 마진 계산기
    </h1>
    <p class="text-xs text-slate-400 mt-1">플랫폼 수수료와 배송비를 정산한 실시간 순수익 리포트</p>
  </div>

  <!-- Form Inputs -->
  <form id="marginForm" class="space-y-4" onsubmit="return false;">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">공구 판매가 (원)</label>
        <input type="number" id="sellingPrice" placeholder="35000" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all text-slate-800 text-sm font-medium bg-slate-50/50 focus:bg-white" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">상품 원가/공급가 (원)</label>
        <input type="number" id="costPrice" placeholder="15000" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all text-slate-800 text-sm font-medium bg-slate-50/50 focus:bg-white" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">플랫폼/PG 수수료 (%)</label>
        <input type="number" step="0.1" id="feeRate" placeholder="3.5" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all text-slate-800 text-sm font-medium bg-slate-50/50 focus:bg-white" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">건당 배송비 (원)</label>
        <input type="number" id="shippingFee" placeholder="3000" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all text-slate-800 text-sm font-medium bg-slate-50/50 focus:bg-white" />
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">예상 판매 수량 (개)</label>
      <input type="number" id="quantity" value="100" placeholder="100" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all text-slate-800 text-sm font-medium bg-slate-50/50 focus:bg-white" />
    </div>
  </form>

  <!-- Receipt Output -->
  <div class="receipt mt-8">
    <div id="receiptCard" class="bg-gradient-to-b from-amber-50/60 to-orange-50/30 border border-amber-200/60 rounded-2xl p-6 shadow-sm relative overflow-hidden font-mono">
      <!-- Receipt Decorative Top Notch -->
      <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-16 h-6 bg-white rounded-full border border-slate-100 shadow-inner"></div>

      <!-- Receipt Header -->
      <div class="text-center pb-4 border-b border-dashed border-amber-300/70">
        <span class="text-[10px] tracking-widest text-amber-700/60 uppercase font-sans font-semibold">Calculation Receipt</span>
        <h2 class="text-lg font-bold text-slate-800 font-sans mt-0.5">정산 영수증</h2>
        <p id="receiptDate" class="text-[11px] text-slate-400 mt-0.5 font-sans"></p>
      </div>

      <!-- Receipt Items -->
      <div class="py-4 space-y-2.5 text-xs text-slate-600">
        <div class="flex justify-between items-center">
          <span>총 매출액 (<span id="resQty">0</span>개)</span>
          <span id="resTotalSales" class="font-semibold text-slate-800">0 원</span>
        </div>
        <div class="flex justify-between items-center text-slate-500">
          <span class="pl-2">- 총 매입 원가</span>
          <span id="resTotalCost">0 원</span>
        </div>
        <div class="flex justify-between items-center text-slate-500">
          <span class="pl-2">- 총 플랫폼 수수료</span>
          <span id="resTotalFee">0 원</span>
        </div>
        <div class="flex justify-between items-center text-slate-500">
          <span class="pl-2">- 총 배송비</span>
          <span id="resTotalShipping">0 원</span>
        </div>
      </div>

      <!-- Total Profit Section -->
      <div class="pt-4 border-t-2 border-dashed border-amber-300/70 space-y-3">
        <div class="flex justify-between items-baseline">
          <span class="text-sm font-bold text-slate-800 font-sans">개당 순수익</span>
          <span id="resProfitPerItem" class="text-base font-bold text-rose-600">0 원</span>
        </div>
        
        <div class="bg-white/80 backdrop-blur-sm rounded-xl p-4 border border-amber-200/50 shadow-sm flex justify-between items-center">
          <div>
            <div class="text-[10px] text-slate-400 font-sans uppercase">Total Net Profit</div>
            <div id="resNetProfit" class="text-xl font-extrabold text-slate-900 mt-0.5">0 원</div>
          </div>
          <div class="text-right">
            <div class="text-[10px] text-slate-400 font-sans uppercase">Margin Rate</div>
            <div id="resMarginRate" class="text-lg font-bold text-emerald-600 mt-0.5">0%</div>
          </div>
        </div>
      </div>

      <!-- Receipt Footer Message -->
      <div class="mt-4 text-center">
        <p class="text-[10px] text-slate-400 font-sans">대박 나는 성공적인 공구를 응원합니다! ✨</p>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const inputs = ['sellingPrice', 'costPrice', 'feeRate', 'shippingFee', 'quantity'];
    const elements = {};

    inputs.forEach(id => {
      elements[id] = document.getElementById(id);
      elements[id].addEventListener('input', calculate);
    });

    // 영수증 날짜 표기
    const now = new Date();
    const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    document.getElementById('receiptDate').innerText = dateStr;

    function formatNumber(num) {
      return new Intl.NumberFormat('ko-KR').format(Math.round(num || 0));
    }

    function calculate() {
      const sellingPrice = parseFloat(elements.sellingPrice.value) || 0;
      const costPrice = parseFloat(elements.costPrice.value) || 0;
      const feeRate = parseFloat(elements.feeRate.value) || 0;
      const shippingFee = parseFloat(elements.shippingFee.value) || 0;
      const quantity = Math.max(1, parseInt(elements.quantity.value) || 0);

      const totalSales = sellingPrice * quantity;
      const totalCost = costPrice * quantity;
      const totalFee = (sellingPrice * (feeRate / 100)) * quantity;
      const totalShipping = shippingFee * quantity;

      const netProfit = totalSales - totalCost - totalFee - totalShipping;
      const profitPerItem = quantity > 0 ? netProfit / quantity : 0;
      const marginRate = totalSales > 0 ? (netProfit / totalSales) * 100 : 0;

      // DOM 업데이트
      document.getElementById('resQty').innerText = formatNumber(quantity);
      document.getElementById('resTotalSales').innerText = `${formatNumber(totalSales)} 원`;
      document.getElementById('resTotalCost').innerText = `-${formatNumber(totalCost)} 원`;
      document.getElementById('resTotalFee').innerText = `-${formatNumber(totalFee)} 원`;
      document.getElementById('resTotalShipping').innerText = `-${formatNumber(totalShipping)} 원`;
      
      const profitPerItemEl = document.getElementById('resProfitPerItem');
      profitPerItemEl.innerText = `${formatNumber(profitPerItem)} 원`;
      profitPerItemEl.className = `text-base font-bold ${profitPerItem >= 0 ? 'text-rose-600' : 'text-blue-600'}`;

      const netProfitEl = document.getElementById('resNetProfit');
      netProfitEl.innerText = `${formatNumber(netProfit)} 원`;
      netProfitEl.className = `text-xl font-extrabold ${netProfit >= 0 ? 'text-slate-900' : 'text-blue-600'}`;

      const marginRateEl = document.getElementById('resMarginRate');
      marginRateEl.innerText = `${marginRate.toFixed(1)}%`;
      marginRateEl.className = `text-lg font-bold ${marginRate >= 0 ? 'text-emerald-600' : 'text-blue-600'}`;
    }

    // 초기 계산 실행
    calculate();
  });
</script>
        <!-- LOGIC END -->
        
    </div>
    
    <!-- Google AdSense -->
    <div class="w-full max-w-md bg-white/50 rounded-lg p-2 text-center text-xs text-gray-500 mb-6">
        <span>광고</span>
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2228289204702106" crossorigin="anonymous"></script>
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2228289204702106" data-ad-slot="1234567890" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
    
    <!-- Web Share API Button -->
    <button onclick="if(navigator.share) navigator.share({title: '인스타 공동구매 마진 계산기', url: window.location.href})" class="w-full max-w-md bg-gray-800 text-white font-bold py-4 rounded-full shadow-lg hover:bg-gray-700 transition flex justify-center items-center gap-2">
        공유하기
    </button>
</body>
</html>
